<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tradewinds BioVentures</title>
<style>
  :root {
    --bg: #1b2b3a;
    --link: #9fd8f5;
    --link-hover: #05a6ea;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }

  img {
    display: block;
    width: min(440px, 78vw);
    height: auto;
  }

  a.contact {
    color: var(--link);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(159, 216, 245, 0.35);
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  a.contact:hover,
  a.contact:focus-visible {
    color: var(--link-hover);
    border-color: var(--link-hover);
  }

  a.contact:focus-visible {
    outline: 2px solid var(--link-hover);
    outline-offset: 6px;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <main>
    <img src="TBVLogo.jpg" />
    <a class="contact" href="mailto:peter@tradewinds.bio?subject=Tradewinds%20Website%20Inquiry">Contact</a>
  </main>
</body>
</html>
